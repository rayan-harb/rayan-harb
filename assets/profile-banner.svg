<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rayan Harb profile banner</title>
  <desc id="desc">A dark blue and violet engineering-themed banner for Rayan Harb.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b36"/>
      <stop offset="1" stop-color="#241247"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(970 30) rotate(120) scale(380 300)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(150 290) rotate(-30) scale(430 260)">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".09"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#a5b4fc" stroke-opacity=".18"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>

  <g opacity=".75" fill="none" stroke-linecap="round">
    <path d="M890 226h68l28-50h68l30-52h74" stroke="#22d3ee" stroke-width="2"/>
    <path d="M875 244h92l24-40h74l24-42h69" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="890" cy="226" r="5" fill="#22d3ee" stroke="none"/>
    <circle cx="1054" cy="176" r="5" fill="#22d3ee" stroke="none"/>
    <circle cx="967" cy="244" r="5" fill="#8b5cf6" stroke="none"/>
    <circle cx="1089" cy="162" r="5" fill="#8b5cf6" stroke="none"/>
  </g>

  <g transform="translate(72 66)">
    <rect x="0" y="0" width="8" height="168" rx="4" fill="#22d3ee"/>
    <text x="38" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="5">RAYAN HARB</text>
    <text x="41" y="116" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="3">ENGINEERING · PRODUCT · DATA</text>
    <text x="41" y="160" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">building useful things, then making them better.</text>
  </g>

  <circle cx="1110" cy="66" r="42" fill="#22d3ee" opacity=".08" filter="url(#soft)"/>
</svg>
